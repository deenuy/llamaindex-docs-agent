site_name: LlamaIndex Agent Documentation
site_description: "Documentation for AI-Powered Document Assistant"
site_author: "Deenu Gengiti"
theme:
  name: material
  palette:
    primary: 'indigo'
    accent: 'indigo'
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.annotate
    - content.tabs.link

nav:
  - Home: index.md
  - Project Overview: project-overview.md
  - API Routes: api.md
  - Agents: reference/agents.md
  - Retrieval Engine: reference/retrieval_engine.md
  - Services: reference/services.md
  - Clients: reference/clients.md
  - Config & Logging:
      - Config: reference/config.md
      - Logger: reference/logger.md
  - Frontend (Gradio): reference/frontend.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
  - section-index

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - toc:
      permalink: true
